$font = Monospace

general {
  hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
  enabled = false
}

background {
  color = rgba(10, 10, 10, 1.0)
  blur_passes = 0
}

input-field {
  monitor =
  size = 25%, 5%
  outline_thickness = 3
  inner_color = rgba(0, 0, 0, 0.0) # no fill

  outer_color = rgba(ffa8ecee)
  check_color = rgba(ffa582ee)
  fail_color = rgba(fc4e4eee)
  font_color = rgb(143, 143, 143)
  fade_on_empty = false
  rounding = 15

  font_family = $font
  placeholder_text = <b>password</b>
  fail_text = erm....

  dots_spacing = 0.3

  position = 0, 0
  halign = center
  valign = center
}

# Time
label {
  text = $TIME
  font_size = 90
  font_family = $font

  position = -30, 0
  halign = right
  valign = top
}

# Date
label {
  text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
  font_size = 25
  font_family = $font

  position = -30, -150
  halign = right
  valign = top
}

# lil guy
image {
  path = $HOME/Images/boykisser/smoking.png
  size = 250
  border_size = 0
  rounding = 0
  halign = right
  valign = bottom
  position = -10, 10
}

# Battery
label {
  text = cmd[update:10000] echo $($HOME/.config/hypr/scripts/lock_battery.sh)
  font_size = 25
  font_family = $font

  position = -30, -200
  halign = right
  valign = top
}
